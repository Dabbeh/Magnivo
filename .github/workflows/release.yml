# Magnivo auto-release.
#
# HOW TO SHIP A VERSION (you do this by hand, ~1 minute):
#   1. Set the new version in 3 places: kMagnivoVersion in Magnivo.h,
#      FILEVERSION/VALUE lines in Magnivo.rc, MyAppVersion in
#      installer/Magnivo.iss. Commit that.
#   2. Tag it and push the tag:  git tag v1.1.0 ; git push origin v1.1.0
#   3. This workflow builds the exe + installer on a Windows machine in
#      the cloud and attaches Magnivo-Setup-1.1.0.exe to the new
#      "Releases" page entry. Users download it from there, and the
#      in-app updater in older versions will offer it automatically.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: win64_msvc2022_64

      - name: Build (release)
        shell: pwsh
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rel

      - name: Collect files (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deploy -Force | Out-Null
          Copy-Item build/rel/Magnivo.exe deploy/
          windeployqt --release --no-translations deploy/Magnivo.exe

      - name: Compile installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1
        with:
          path: installer/Magnivo.iss

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Magnivo-Setup-*.exe
          generate_release_notes: true
